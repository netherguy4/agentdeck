name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - name: Build
        run: |
          cargo build --release --locked -p agentdeck -p agentdeck-applet

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for bin in agentdeck agentdeck-applet; do
            stage="dist/$bin-$VERSION-x86_64"
            mkdir -p "$stage"
            install -m 0755 "target/release/$bin" "$stage/$bin"
            cp LICENSE README.md "$stage/"
            tar -C dist -czf "$stage.tar.gz" "$(basename "$stage")"
            rm -rf "$stage"
          done
          cp crates/agentdeck/agentdeck.desktop dist/
          ls dist/

      - uses: actions/upload-artifact@v4
        with:
          name: agentdeck-x86_64
          path: |
            dist/*.tar.gz
            dist/agentdeck.desktop
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentdeck-x86_64
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXTRA=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/agentdeck.desktop \
            --generate-notes --verify-tag "${EXTRA[@]}"
