limit_id = "codex"

[[accounts]]
provider = "codex"
id = "codex-work"
name = "Codex Work"
codex_home = "~/.codex-work"
command = "codex"
limit_id = "codex"

[[accounts]]
provider = "deepseek"
id = "deepseek-main"
name = "DeepSeek"
api_key_env = "AI_USAGE_DEEPSEEK_DEEPSEEK_MAIN"
