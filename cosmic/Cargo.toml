[package]
name = "ai-usage-cosmic"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["applet", "dbus-config", "a11y"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
debug = 0

[profile.dev]
debug = 0
