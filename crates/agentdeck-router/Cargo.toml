[package]
name = "agentdeck-router"
version = "0.1.1"
edition = "2024"
description = "Port of the model-route Node router: route/policy/load/reasoning for `agentdeck route`"
license = "GPL-3.0-or-later"
repository = "https://github.com/netherg-io/agentdeck"
rust-version = "1.93"

[dependencies]
agentdeck-core = { path = "../agentdeck-core" }
anyhow = "1.0"
libc = "0.2"
regex = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
