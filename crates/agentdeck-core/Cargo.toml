[package]
name = "agentdeck-core"
version = "0.1.2"
edition = "2024"
description = "Registry and harness adapters for agentdeck"
license = "GPL-3.0-or-later"
repository = "https://github.com/netherg-io/agentdeck"
rust-version = "1.93"

[dependencies]
anyhow = "1.0"
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
