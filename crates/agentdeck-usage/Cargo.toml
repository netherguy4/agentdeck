[package]
name = "agentdeck-usage"
version = "0.1.0"
edition = "2024"
description = "Usage polling providers, state model and history for agentdeck"
license = "GPL-3.0-or-later"
repository = "https://github.com/netherguy4/agentdeck"
rust-version = "1.93"

[dependencies]
agentdeck-core = { path = "../agentdeck-core" }
anyhow = "1.0"
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
