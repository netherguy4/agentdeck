[package]
name = "ai-usage"
version = "0.1.0"
edition = "2021"
description = "GNOME panel widget backend for Claude, Codex and DeepSeek usage"
license = "GPL-3.0-or-later"
repository = "https://github.com/netherguy4/ai-usage-gnome"
rust-version = "1.86"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
