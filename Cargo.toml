[package]
name = "ai-usage"
version = "0.1.0"
edition = "2021"
description = "GNOME panel widget backend for Claude, Codex, Antigravity and DeepSeek usage"
license = "GPL-3.0-or-later"
repository = "https://github.com/netherguy4/ai-usage-gnome"
rust-version = "1.93"

[workspace]
members = [".", "crates/*"]
# libcosmic is heavy: the applet builds in its own CI job, not in the default gates.
default-members = [".", "crates/agentdeck", "crates/agentdeck-core", "crates/agentdeck-gui", "crates/agentdeck-usage", "crates/agent-process"]
resolver = "2"

[dependencies]
agentdeck-usage = { path = "crates/agentdeck-usage" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
