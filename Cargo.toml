[workspace]
members = ["crates/*"]
# libcosmic is heavy: the applet builds in its own CI job, not in the default gates.
default-members = ["crates/agentdeck", "crates/agentdeck-core", "crates/agentdeck-gui", "crates/agentdeck-usage", "crates/agent-process"]
resolver = "2"

[workspace.package]
rust-version = "1.93"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
